<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
        <title th:text="#{password.tituloPagina}">
            Cambiar contraseña | FIDNESS
        </title>
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}">
        </header>

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <div class="card shadow-lg">

                        <div class="card-body p-4 p-md-5">

                            <div class="text-center mb-4">

                                <div class="
                                     rounded-circle
                                     bg-success
                                     text-white
                                     d-flex
                                     align-items-center
                                     justify-content-center
                                     mx-auto
                                     mb-3
                                     shadow
                                     "
                                     style="
                                     width:90px;
                                     height:90px;
                                     font-size:38px;
                                     ">

                                    <i class="fas fa-key"></i>

                                </div>

                                <h2 class="titulo"
                                    th:text="#{password.titulo}">
                                    Cambiar contraseña
                                </h2>

                                <p class="text-muted"
                                   th:text="#{password.descripcion}">
                                    Actualiza la contraseña de tu
                                    cuenta FIDNESS.
                                </p>

                            </div>

                            <div th:if="${error}"
                                 class="alert alert-danger">

                                <i class="fas fa-triangle-exclamation me-2"></i>

                                <span th:text="${error}">
                                    Error
                                </span>

                            </div>

                            <div class="alert alert-light border">

                                <i class="fas fa-user me-2 text-success"></i>

                                <span th:text="#{password.sesion}">
                                    Sesión iniciada como
                                </span>

                                <strong th:text="${usuario.nombre
                                        + ' '
                                        + usuario.apellidos}">
                                    Usuario
                                </strong>

                            </div>

                            <form th:action="@{/perfil/password/guardar}"
                                  method="POST">

                                <div class="mb-4">

                                    <label class="form-label"
                                           th:text="#{password.actual}">
                                        Contraseña actual
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>

                                        <input type="password"
                                               name="passwordActual"
                                               class="form-control"
                                               th:placeholder="#{password.actualPlaceholder}"
                                               required/>

                                    </div>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label"
                                           th:text="#{password.nueva}">
                                        Nueva contraseña
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="fas fa-key"></i>
                                        </span>

                                        <input type="password"
                                               name="nuevaPassword"
                                               class="form-control"
                                               th:placeholder="#{password.nuevaPlaceholder}"
                                               minlength="4"
                                               required/>

                                    </div>

                                    <small class="text-muted"
                                           th:text="#{password.requisito}">
                                        Debe tener al menos 4 caracteres.
                                    </small>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label"
                                           th:text="#{password.confirmar}">
                                        Confirmar nueva contraseña
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="fas fa-check"></i>
                                        </span>

                                        <input type="password"
                                               name="confirmarPassword"
                                               class="form-control"
                                               th:placeholder="#{password.confirmarPlaceholder}"
                                               minlength="4"
                                               required/>

                                    </div>

                                </div>

                                <div class="d-grid gap-2">

                                    <button type="submit"
                                            class="btn btn-success">

                                        <i class="fas fa-save me-2"></i>

                                        <span th:text="#{password.actualizar}">
                                            Actualizar contraseña
                                        </span>

                                    </button>

                                    <a th:href="@{/perfil}"
                                       class="btn btn-outline-secondary">

                                        <i class="fas fa-arrow-left me-2"></i>

                                        <span th:text="#{password.volver}">
                                            Volver a Mi Perfil
                                        </span>

                                    </a>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>

</html>
