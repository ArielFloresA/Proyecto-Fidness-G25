<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head th:fragment="head">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title th:text="#{aplicacion.titulo}">
            FIDNESS
        </title>

        <link rel="stylesheet"
              th:href="@{/css/bootstrap.min.css}"/>

        <link th:href="@{/webjars/font-awesome/css/all.css}"
              rel="stylesheet"/>

        <style>

            body{
                background:#f5f7fa;
                font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
            }

            .navbar{
                background:linear-gradient(90deg,#0d6efd,#198754);
            }

            .navbar-brand{
                font-size:1.7rem;
                font-weight:bold;
                letter-spacing:1px;
            }

            .nav-link{
                color:white !important;
                font-weight:500;
                transition:.3s;
            }

            .nav-link:hover{
                color:#ffe082 !important;
            }

            .hero{
                background:linear-gradient(rgba(13,110,253,.85),
                    rgba(25,135,84,.80)),
                    url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=1600');
                background-size:cover;
                background-position:center;
                color:white;
                border-radius:20px;
                padding:80px 50px;
            }

            .hero h1{
                font-size:3rem;
                font-weight:bold;
            }

            .hero p{
                font-size:1.2rem;
            }

            .card{
                border:none;
                border-radius:18px;
            }

            .card:hover{
                transform:translateY(-5px);
                transition:.3s;
            }

            .titulo{
                color:#0d6efd;
                font-weight:bold;
            }

            footer{
                background:#212529;
                color:white;
                margin-top:60px;
            }

            .idiomas{
                margin-top:15px;
            }

            .idioma-link{
                display:inline-flex;
                align-items:center;
                gap:6px;
                text-decoration:none;
                color:white;
                padding:6px 10px;
                border-radius:8px;
                transition:.2s;
                border:1px solid rgba(255,255,255,.25);
            }

            .idioma-link:hover{
                background:rgba(255,255,255,.12);
                color:white;
                transform:translateY(-1px);
            }

            .bandera{
                font-size:24px;
                line-height:1;
            }

        </style>

    </head>

    <body>

        <header th:fragment="header">

            <nav class="navbar navbar-expand-lg navbar-dark shadow">

                <div class="container">

                    <a class="navbar-brand"
                       th:href="@{/}">

                        🏋 FIDNESS

                    </a>

                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#menu"
                            aria-controls="menu"
                            aria-expanded="false">

                        <span class="navbar-toggler-icon"></span>

                    </button>

                    <div class="collapse navbar-collapse"
                         id="menu">

                        <ul class="navbar-nav ms-auto">

                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/}"
                                   th:text="#{menu.inicio}">
                                    Inicio
                                </a>

                            </li>

                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/ejercicio/listado}"
                                   th:text="#{menu.ejercicios}">
                                    Ejercicios
                                </a>

                            </li>

                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/rutina/listado}"
                                   th:text="#{menu.rutinas}">
                                    Rutinas
                                </a>

                            </li>

                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/membresia/listado}"
                                   th:text="#{menu.membresias}">
                                    Membresías
                                </a>

                            </li>

                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/clase/listado}"
                                   th:text="#{menu.clases}">
                                    Clases
                                </a>

                            </li>

                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/progreso/listado}"
                                   th:text="#{menu.progreso}">
                                    Mi Progreso
                                </a>

                            </li>

                            <li class="nav-item"
                                sec:authorize="hasRole('ROLE_ADMIN')">

                                <a class="nav-link"
                                   th:href="@{/admin}"
                                   th:text="#{menu.administracion}">
                                    Administración
                                </a>

                            </li>

                            <li class="nav-item">

                                <a class="nav-link"
                                   th:href="@{/acerca}"
                                   th:text="#{menu.acerca}">
                                    Acerca de
                                </a>

                            </li>

                        </ul>

                        <div class="ms-3 d-flex gap-2"
                             sec:authorize="isAnonymous()">

                            <a th:href="@{/login}"
                               class="btn btn-outline-light btn-sm"
                               th:text="#{auth.login}">
                                Iniciar sesión
                            </a>

                            <a th:href="@{/registro}"
                               class="btn btn-warning btn-sm"
                               th:text="#{auth.registro}">
                                Registrarse
                            </a>

                        </div>

                        <div class="ms-3 d-flex align-items-center gap-2"
                             sec:authorize="isAuthenticated()">

                            <a th:href="@{/perfil}"
                               class="btn btn-outline-light btn-sm">

                                <i class="fas fa-user me-1"></i>

                                <span th:text="#{menu.perfil}">
                                    Mi Perfil
                                </span>

                            </a>

                            <form th:action="@{/logout}"
                                  method="POST"
                                  class="m-0">

                                <button type="submit"
                                        class="btn btn-outline-light btn-sm">

                                    <span th:text="#{auth.logout}">
                                        Cerrar sesión
                                    </span>

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </nav>

        </header>

        <footer th:fragment="footer">

            <div class="container py-4 text-center">

                <h5>
                    FIDNESS
                </h5>

                <p class="mb-1"
                   th:text="#{footer.curso}">
                    Desarrollo de Aplicaciones Web y Patrones
                </p>

                <small th:text="#{footer.derechos}">
                    © 2026 Ariel Flores
                </small>

                <div class="idiomas">

                    <div class="small text-light mb-2"
                         th:text="#{footer.idioma}">
                        Seleccionar idioma
                    </div>

                    <div class="d-flex justify-content-center gap-2">

                        <a th:href="@{/(lang='es')}"
                           class="idioma-link"
                           th:title="#{idioma.espanol}">

                            <span class="bandera">🇨🇷</span>

                            <span th:text="#{idioma.espanol}">
                                Español
                            </span>

                        </a>

                        <a th:href="@{/(lang='en')}"
                           class="idioma-link"
                           th:title="#{idioma.ingles}">

                            <span class="bandera">🇺🇸</span>

                            <span th:text="#{idioma.ingles}">
                                English
                            </span>

                        </a>

                    </div>

                </div>

            </div>

            <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

        </footer>

    </body>

</html>
