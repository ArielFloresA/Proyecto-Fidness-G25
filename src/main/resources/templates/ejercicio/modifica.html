<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}">
        </header>

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-lg-9">

                    <div class="card shadow">

                        <div class="card-body p-5">

                            <h2 class="titulo mb-4"
                                th:text="${ejercicio.idEjercicio == null}
                                ? #{ejercicio.nuevo}
                                : #{ejercicio.editarTitulo}">
                                Nuevo Ejercicio
                            </h2>

                            <form th:action="@{/ejercicio/guardar}"
                                  th:object="${ejercicio}"
                                  method="POST"
                                  enctype="multipart/form-data">

                                <input type="hidden"
                                       th:field="*{idEjercicio}"/>

                                <div class="mb-3">

                                    <label class="form-label"
                                           th:text="#{ejercicio.nombre}">
                                        Nombre
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           required/>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label"
                                           th:text="#{ejercicio.descripcion}">
                                        Descripción
                                    </label>

                                    <textarea class="form-control"
                                              rows="3"
                                              th:field="*{descripcion}"
                                              required>
                                    </textarea>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label"
                                           th:text="#{ejercicio.instrucciones}">
                                        Instrucciones
                                    </label>

                                    <textarea class="form-control"
                                              rows="4"
                                              th:field="*{instrucciones}">
                                    </textarea>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label"
                                           th:text="#{ejercicio.recomendaciones}">
                                        Recomendaciones
                                    </label>

                                    <textarea class="form-control"
                                              rows="4"
                                              th:field="*{recomendaciones}">
                                    </textarea>

                                </div>

                                <div class="row">

                                    <div class="col-md-4 mb-3">

                                        <label class="form-label"
                                               th:text="#{ejercicio.grupo}">
                                            Grupo muscular
                                        </label>

                                        <select class="form-select"
                                                th:field="*{grupoMuscular}"
                                                required>

                                            <option value=""
                                                    th:text="#{ejercicio.seleccionar}">
                                                Seleccione
                                            </option>

                                            <option value="Pecho"
                                                    th:text="#{ejercicio.grupo.pecho}">
                                                Pecho
                                            </option>

                                            <option value="Espalda"
                                                    th:text="#{ejercicio.grupo.espalda}">
                                                Espalda
                                            </option>

                                            <option value="Piernas"
                                                    th:text="#{ejercicio.grupo.piernas}">
                                                Piernas
                                            </option>

                                            <option value="Bíceps"
                                                    th:text="#{ejercicio.grupo.biceps}">
                                                Bíceps
                                            </option>

                                            <option value="Tríceps"
                                                    th:text="#{ejercicio.grupo.triceps}">
                                                Tríceps
                                            </option>

                                            <option value="Hombros"
                                                    th:text="#{ejercicio.grupo.hombros}">
                                                Hombros
                                            </option>

                                            <option value="Abdomen"
                                                    th:text="#{ejercicio.grupo.abdomen}">
                                                Abdomen
                                            </option>

                                            <option value="Cardio"
                                                    th:text="#{ejercicio.grupo.cardio}">
                                                Cardio
                                            </option>

                                        </select>

                                    </div>

                                    <div class="col-md-4 mb-3">

                                        <label class="form-label"
                                               th:text="#{ejercicio.nivel}">
                                            Nivel
                                        </label>

                                        <select class="form-select"
                                                th:field="*{nivel}"
                                                required>

                                            <option value=""
                                                    th:text="#{ejercicio.seleccionar}">
                                                Seleccione
                                            </option>

                                            <option value="Principiante"
                                                    th:text="#{ejercicio.nivel.principiante}">
                                                Principiante
                                            </option>

                                            <option value="Intermedio"
                                                    th:text="#{ejercicio.nivel.intermedio}">
                                                Intermedio
                                            </option>

                                            <option value="Avanzado"
                                                    th:text="#{ejercicio.nivel.avanzado}">
                                                Avanzado
                                            </option>

                                        </select>

                                    </div>

                                    <div class="col-md-4 mb-3">

                                        <label class="form-label"
                                               th:text="#{ejercicio.tipo}">
                                            Tipo de entrenamiento
                                        </label>

                                        <select class="form-select"
                                                th:field="*{tipoEntrenamiento}"
                                                required>

                                            <option value=""
                                                    th:text="#{ejercicio.seleccionar}">
                                                Seleccione
                                            </option>

                                            <option value="Fuerza"
                                                    th:text="#{ejercicio.tipo.fuerza}">
                                                Fuerza
                                            </option>

                                            <option value="Cardio"
                                                    th:text="#{ejercicio.tipo.cardio}">
                                                Cardio
                                            </option>

                                            <option value="Core"
                                                    th:text="#{ejercicio.tipo.core}">
                                                Core
                                            </option>

                                        </select>

                                    </div>

                                </div>

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{ejercicio.series}">
                                            Series
                                        </label>

                                        <input type="number"
                                               min="1"
                                               class="form-control"
                                               th:field="*{series}"
                                               required/>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{ejercicio.repeticiones}">
                                            Repeticiones
                                        </label>

                                        <input type="number"
                                               min="1"
                                               class="form-control"
                                               th:field="*{repeticiones}"
                                               required/>

                                    </div>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label"
                                           th:text="#{ejercicio.imagen}">
                                        Imagen
                                    </label>

                                    <input type="file"
                                           name="imagenFile"
                                           class="form-control"
                                           accept="image/*"/>

                                    <small class="text-muted"
                                           th:if="${ejercicio.idEjercicio != null}"
                                           th:text="#{ejercicio.imagenAyuda}">
                                        Si no seleccionas una imagen,
                                        se conservará la actual.
                                    </small>

                                </div>

                                <div class="form-check
                                     form-switch mb-4">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{activo}"/>

                                    <label class="form-check-label"
                                           th:text="#{ejercicio.estadoActivo}">
                                        Ejercicio activo
                                    </label>

                                </div>

                                <div class="d-flex gap-2">

                                    <button type="submit"
                                            class="btn btn-success">

                                        <i class="fas fa-save me-1"></i>

                                        <span th:text="#{accion.guardar}">
                                            Guardar
                                        </span>

                                    </button>

                                    <a th:href="@{/ejercicio/listado}"
                                       class="btn btn-outline-secondary"
                                       th:text="#{accion.cancelar}">
                                        Cancelar
                                    </a>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>

</html>
