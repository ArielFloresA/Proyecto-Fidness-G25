<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}">
        </header>

        <div class="container py-5">

            <div class="card shadow">

                <div class="card-header
                     bg-success text-white">

                    <h3 th:text="#{ejercicio.agregar.titulo}">
                        Agregar Ejercicio a una Rutina
                    </h3>

                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-4 text-center">

                            <img th:src="${ejercicio.imagen}"
                                 class="img-fluid rounded shadow"
                                 style="max-height:250px;"/>

                        </div>

                        <div class="col-md-8">

                            <h3 th:text="${ejercicio.nombre}">
                            </h3>

                            <hr/>

                            <p>

                                <strong th:text="#{ejercicio.grupo}">
                                    Grupo muscular:
                                </strong>

                                <span th:if="${ejercicio.grupoMuscular == 'Pecho'}"
                                      th:text="#{ejercicio.grupo.pecho}">
                                </span>

                                <span th:if="${ejercicio.grupoMuscular == 'Espalda'}"
                                      th:text="#{ejercicio.grupo.espalda}">
                                </span>

                                <span th:if="${ejercicio.grupoMuscular == 'Piernas'}"
                                      th:text="#{ejercicio.grupo.piernas}">
                                </span>

                                <span th:if="${ejercicio.grupoMuscular == 'Bíceps'}"
                                      th:text="#{ejercicio.grupo.biceps}">
                                </span>

                                <span th:if="${ejercicio.grupoMuscular == 'Tríceps'}"
                                      th:text="#{ejercicio.grupo.triceps}">
                                </span>

                                <span th:if="${ejercicio.grupoMuscular == 'Hombros'}"
                                      th:text="#{ejercicio.grupo.hombros}">
                                </span>

                                <span th:if="${ejercicio.grupoMuscular == 'Abdomen'}"
                                      th:text="#{ejercicio.grupo.abdomen}">
                                </span>

                                <span th:if="${ejercicio.grupoMuscular == 'Cardio'}"
                                      th:text="#{ejercicio.grupo.cardio}">
                                </span>

                            </p>

                            <p>

                                <strong th:text="#{ejercicio.nivel}">
                                    Nivel:
                                </strong>

                                <span th:if="${ejercicio.nivel == 'Principiante'}"
                                      th:text="#{ejercicio.nivel.principiante}">
                                </span>

                                <span th:if="${ejercicio.nivel == 'Intermedio'}"
                                      th:text="#{ejercicio.nivel.intermedio}">
                                </span>

                                <span th:if="${ejercicio.nivel == 'Avanzado'}"
                                      th:text="#{ejercicio.nivel.avanzado}">
                                </span>

                            </p>

                            <p th:text="${ejercicio.descripcion}">
                            </p>

                        </div>

                    </div>

                    <hr/>

                    <div th:if="${rutinas == null
                         or rutinas.empty}"
                         class="alert alert-info">

                        <span th:text="#{ejercicio.agregar.sinRutina}">
                            Primero debes crear una rutina.
                        </span>

                        <div class="mt-3">

                            <a th:href="@{/rutina/nuevo}"
                               class="btn btn-success"
                               th:text="#{ejercicio.agregar.crearRutina}">

                                Crear Rutina

                            </a>

                        </div>

                    </div>

                    <form th:if="${rutinas != null
                          and !rutinas.empty}"
                          th:action="@{/rutina/agregarEjercicio}"
                          method="POST">

                        <input type="hidden"
                               name="idEjercicio"
                               th:value="${ejercicio.idEjercicio}"/>

                        <div class="mb-3">

                            <label class="form-label"
                                   th:text="#{ejercicio.agregar.seleccionarRutina}">

                                Seleccione una rutina

                            </label>

                            <select name="idRutina"
                                    class="form-select"
                                    required>

                                <option value=""
                                        th:text="#{ejercicio.seleccionar}">

                                    Seleccione

                                </option>

                                <option
                                    th:each="r : ${rutinas}"
                                    th:value="${r.idRutina}"
                                    th:text="${r.nombre}">
                                </option>

                            </select>

                        </div>

                        <div class="d-grid gap-2">

                            <button type="submit"
                                    class="btn btn-success"
                                    th:text="#{ejercicio.agregarRutina}">

                                Agregar a Rutina

                            </button>

                            <a th:href="@{/ejercicio/listado}"
                               class="btn btn-secondary"
                               th:text="#{accion.cancelar}">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>

</html>
