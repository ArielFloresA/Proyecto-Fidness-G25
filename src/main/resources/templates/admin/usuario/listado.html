<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}">
        </header>

        <div class="container py-5">

            <div th:if="${param.eliminado}"
                 class="alert alert-success"
                 th:text="#{admin.usuario.listado.eliminado}">
                Usuario eliminado correctamente.
            </div>

            <div class="d-flex
                 justify-content-between
                 align-items-center
                 mb-4">

                <div>

                    <h1 class="titulo"
                        th:text="#{admin.usuario.listado.titulo}">
                        Administración de Usuarios
                    </h1>

                    <p class="text-muted mb-0"
                       th:text="#{admin.usuario.listado.descripcion}">
                        Consulta los usuarios registrados
                        y administra sus permisos.
                    </p>

                </div>

                <a th:href="@{/admin}"
                   class="btn btn-outline-secondary">

                    <i class="fas fa-arrow-left me-1"></i>

                    <span th:text="#{admin.usuario.listado.panel}">
                        Panel
                    </span>

                </a>

            </div>

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h5 class="mb-0">

                        <i class="fas fa-users me-2"></i>

                        <span th:text="#{admin.usuario.listado.registrados}">
                            Usuarios registrados
                        </span>

                    </h5>

                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table
                               table-hover
                               align-middle">

                            <thead>

                                <tr>

                                    <th th:text="#{admin.usuario.foto}">
                                        Foto
                                    </th>

                                    <th th:text="#{admin.usuario.usuario}">
                                        Usuario
                                    </th>

                                    <th th:text="#{admin.usuario.nombre}">
                                        Nombre
                                    </th>

                                    <th th:text="#{admin.usuario.correo}">
                                        Correo
                                    </th>

                                    <th th:text="#{admin.usuario.estado}">
                                        Estado
                                    </th>

                                    <th th:text="#{admin.usuario.roles}">
                                        Roles
                                    </th>

                                    <th th:text="#{admin.usuario.acciones}">
                                        Acciones
                                    </th>

                                </tr>

                            </thead>

                            <tbody>

                                <tr th:each="u : ${usuarios}">

                                    <td>

                                        <img th:if="${u.rutaImagen != null
                                             and !u.rutaImagen.isEmpty()}"
                                             th:src="${u.rutaImagen}"
                                             alt="Perfil"
                                             class="rounded-circle"
                                             style="width:55px;
                                             height:55px;
                                             object-fit:cover;"/>

                                        <div th:if="${u.rutaImagen == null
                                             or u.rutaImagen.isEmpty()}"
                                             class="rounded-circle
                                             bg-secondary
                                             text-white
                                             d-flex
                                             align-items-center
                                             justify-content-center"
                                             style="width:55px;
                                             height:55px;">

                                            <i class="fas fa-user"></i>

                                        </div>

                                    </td>

                                    <td>

                                        <strong th:text="${u.username}">
                                            usuario
                                        </strong>

                                    </td>

                                    <td th:text="${u.nombre + ' ' + u.apellidos}">
                                        Nombre
                                    </td>

                                    <td th:text="${u.correo}">
                                        correo
                                    </td>

                                    <td>

                                        <span th:if="${u.activo}"
                                              class="badge bg-success"
                                              th:text="#{admin.usuario.activo}">
                                            Activo
                                        </span>

                                        <span th:unless="${u.activo}"
                                              class="badge bg-danger"
                                              th:text="#{admin.usuario.inactivo}">
                                            Inactivo
                                        </span>

                                    </td>

                                    <td>

                                        <span th:each="r : ${u.roles}"
                                              class="badge bg-secondary me-1"
                                              th:text="${#strings.replace(
                                              r.nombre,
                                              'ROLE_',
                                              '')}">
                                            USER
                                        </span>

                                    </td>

                                    <td>

                                        <a th:href="@{/admin/usuario/detalle/{id}(id=${u.idUsuario})}"
                                           class="btn
                                           btn-primary
                                           btn-sm">

                                            <i class="fas fa-eye me-1"></i>

                                            <span th:text="#{admin.usuario.administrar}">
                                                Administrar
                                            </span>

                                        </a>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>

</html>
