<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}">
        </header>

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="card shadow">

                        <div class="card-body p-5">

                            <h2 class="titulo mb-4"
                                th:text="${clase.idClase == null
                                ? #messages.msg('admin.clase.form.nueva')
                                : #messages.msg('admin.clase.form.editar')}">
                                Nueva Clase
                            </h2>

                            <form th:action="@{/admin/clase/guardar}"
                                  th:object="${clase}"
                                  method="POST">

                                <input type="hidden"
                                       th:field="*{idClase}"/>

                                <div class="mb-3">

                                    <label class="form-label"
                                           th:text="#{admin.clase.form.nombre}">
                                        Nombre
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           required/>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label"
                                           th:text="#{admin.clase.form.descripcion}">
                                        Descripción
                                    </label>

                                    <textarea class="form-control"
                                              rows="3"
                                              th:field="*{descripcion}"
                                              required>
                                    </textarea>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label"
                                           th:text="#{admin.clase.form.instructor}">
                                        Instructor
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{instructor}"
                                           required/>

                                </div>

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{admin.clase.form.fecha}">
                                            Fecha
                                        </label>

                                        <input type="date"
                                               class="form-control"
                                               th:field="*{fecha}"
                                               required/>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{admin.clase.form.hora}">
                                            Hora
                                        </label>

                                        <input type="time"
                                               class="form-control"
                                               th:field="*{hora}"
                                               required/>

                                    </div>

                                </div>

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{admin.clase.form.duracion}">
                                            Duración (minutos)
                                        </label>

                                        <input type="number"
                                               min="1"
                                               class="form-control"
                                               th:field="*{duracion}"
                                               required/>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{admin.clase.form.capacidad}">
                                            Capacidad
                                        </label>

                                        <input type="number"
                                               min="1"
                                               class="form-control"
                                               th:field="*{capacidad}"
                                               required/>

                                    </div>

                                </div>

                                <div class="form-check form-switch mb-4">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{activo}"/>

                                    <label class="form-check-label"
                                           th:text="#{admin.clase.form.activa}">
                                        Clase activa
                                    </label>

                                </div>

                                <div class="d-flex gap-2">

                                    <button type="submit"
                                            class="btn btn-success"
                                            th:text="#{admin.clase.form.guardar}">
                                        Guardar
                                    </button>

                                    <a th:href="@{/admin/clase/listado}"
                                       class="btn btn-outline-secondary"
                                       th:text="#{admin.clase.form.cancelar}">
                                        Cancelar
                                    </a>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>

</html>
