<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}">
        </header>

        <div class="container py-5">

            <div class="card shadow mb-4">

                <div class="card-header
                     bg-primary text-white">

                    <div class="d-flex
                         justify-content-between
                         align-items-center">

                        <h3 class="mb-0"
                            th:text="${rutina.nombre}">
                        </h3>

                        <span class="badge bg-success"
                              th:if="${rutina.activo}"
                              th:text="#{rutina.activa}">
                            Activa
                        </span>

                    </div>

                </div>

                <div class="card-body">

                    <p>

                        <strong th:text="#{rutina.objetivo}">
                            Objetivo
                        </strong>

                        <strong>:</strong>

                        <span th:text="${rutina.objetivo}">
                        </span>

                    </p>

                    <div class="row text-center">

                        <div class="col-md-4">

                            <div th:switch="${rutina.nivel}">

                                <h4 class="text-primary"
                                    th:case="'Principiante'"
                                    th:text="#{rutina.nivel.principiante}">
                                    Principiante
                                </h4>

                                <h4 class="text-primary"
                                    th:case="'Intermedio'"
                                    th:text="#{rutina.nivel.intermedio}">
                                    Intermedio
                                </h4>

                                <h4 class="text-primary"
                                    th:case="'Avanzado'"
                                    th:text="#{rutina.nivel.avanzado}">
                                    Avanzado
                                </h4>

                                <h4 class="text-primary"
                                    th:case="*"
                                    th:text="${rutina.nivel}">
                                </h4>

                            </div>

                            <small th:text="#{rutina.nivel}">
                                Nivel
                            </small>

                        </div>

                        <div class="col-md-4">

                            <h4 class="text-success"
                                th:text="${rutina.duracion}">
                            </h4>

                            <small th:text="#{rutina.minutos}">
                                Minutos
                            </small>

                        </div>

                        <div class="col-md-4">

                            <h4 th:text="${rutina.ejercicios.size()}">
                            </h4>

                            <small th:text="#{rutina.ejercicios}">
                                Ejercicios
                            </small>

                        </div>

                    </div>

                </div>

            </div>


            <div class="d-flex gap-2 mb-4">

                <a th:href="@{/rutina/editar/{id}(id=${rutina.idRutina})}"
                   class="btn btn-warning">

                    <span th:text="#{rutina.editarRutina}">
                        Editar Rutina
                    </span>

                </a>

                <a th:href="@{/rutina/exportar/{id}(id=${rutina.idRutina})}"
                   class="btn btn-outline-success">

                    <i class="fas fa-file-pdf me-1"></i>

                    <span th:text="#{rutina.exportar}">
                        Exportar PDF
                    </span>

                </a>

                <a th:href="@{/rutina/listado}"
                   class="btn btn-outline-secondary"
                   th:text="#{rutina.volver}">

                    Volver

                </a>

            </div>


            <div class="card shadow mb-5">

                <div class="card-header
                     bg-dark text-white">

                    <h4 class="mb-0"
                        th:text="#{rutina.detalle.ejercicios}">
                        Ejercicios de la Rutina
                    </h4>

                </div>

                <div class="card-body">

                    <div th:if="${rutina.ejercicios.empty}"
                         class="alert alert-info"
                         th:text="#{rutina.detalle.sinEjercicios}">

                        Esta rutina todavía no tiene ejercicios.

                    </div>

                    <div class="row g-4">

                        <div class="col-md-6 col-lg-4"
                             th:each="e : ${rutina.ejercicios}">

                            <div class="card h-100 shadow-sm">

                                <img th:src="${e.imagen}"
                                     class="card-img-top"
                                     style="
                                     height:200px;
                                     object-fit:cover;
                                     "/>

                                <div class="card-body">

                                    <h5 th:text="${e.nombre}">
                                    </h5>

                                    <span class="badge bg-primary"
                                          th:text="${e.grupoMuscular}">
                                    </span>

                                    <span class="badge bg-success"
                                          th:text="${e.nivel}">
                                    </span>

                                    <hr/>

                                    <p class="mb-1">

                                        <strong th:text="#{ejercicio.series}">
                                            Series
                                        </strong>

                                        <strong>:</strong>

                                        <span th:text="${e.series}">
                                        </span>

                                    </p>

                                    <p>

                                        <strong th:text="#{ejercicio.repeticiones}">
                                            Repeticiones
                                        </strong>

                                        <strong>:</strong>

                                        <span th:text="${e.repeticiones}">
                                        </span>

                                    </p>

                                </div>

                                <div class="card-footer
                                     bg-white">

                                    <a th:href="@{/rutina/eliminarEjercicio/{rutina}/{ejercicio}(rutina=${rutina.idRutina},ejercicio=${e.idEjercicio})}"
                                       class="btn
                                       btn-outline-danger
                                       w-100"
                                       th:text="#{rutina.detalle.quitar}">

                                        Quitar de Rutina

                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <div class="card shadow">

                <div class="card-header
                     bg-success text-white">

                    <h4 class="mb-0"
                        th:text="#{rutina.agregar.titulo}">
                        Agregar Ejercicio
                    </h4>

                </div>

                <div class="card-body">

                    <form th:action="@{/rutina/agregarEjercicio}"
                          method="POST">

                        <input type="hidden"
                               name="idRutina"
                               th:value="${rutina.idRutina}"/>

                        <div class="row align-items-end">

                            <div class="col-md-9">

                                <label class="form-label"
                                       th:text="#{rutina.agregar.seleccionar}">
                                    Seleccione un ejercicio
                                </label>

                                <select name="idEjercicio"
                                        class="form-select"
                                        required>

                                    <option value=""
                                            th:text="#{rutina.agregar.opcion}">
                                        Seleccione
                                    </option>

                                    <option
                                        th:each="e : ${ejerciciosDisponibles}"
                                        th:value="${e.idEjercicio}"
                                        th:text="${e.nombre
                                        + ' - '
                                        + e.grupoMuscular
                                        + ' - '
                                        + e.nivel}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-3">

                                <button type="submit"
                                        class="btn
                                        btn-success
                                        w-100"
                                        th:text="#{rutina.agregar.boton}">

                                    Agregar

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>

</html>
