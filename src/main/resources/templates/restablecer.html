<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head>

        <meta charset="UTF-8"/>

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0"/>

        <title th:text="#{restablecer.tituloPagina}">
            Nueva contraseña | FIDNESS
        </title>

        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
              rel="stylesheet"/>

        <link th:href="@{/webjars/font-awesome/css/all.css}"
              rel="stylesheet"/>

        <style>

            body {
                background-color: #f5f7f8;
                min-height: 100vh;
            }

            .password-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .password-card {
                max-width: 500px;
                width: 100%;
                border: none;
                border-radius: 20px;
            }

            .brand-title {
                font-weight: 800;
                letter-spacing: 2px;
            }

            .btn-fidness {
                background-color: #198754;
                color: white;
                font-weight: 600;
            }

            .btn-fidness:hover {
                background-color: #157347;
                color: white;
            }

        </style>

    </head>

    <body>

        <div class="container password-container">

            <div class="card shadow-lg password-card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h1 class="brand-title text-success">
                            FIDNESS
                        </h1>

                        <h4 th:text="#{restablecer.titulo}">
                            Crear nueva contraseña
                        </h4>

                        <p class="text-muted"
                           th:text="#{restablecer.descripcion}">
                            Ingresa y confirma tu nueva contraseña.
                        </p>

                    </div>

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <form th:action="@{/recuperar/cambiar}"
                          method="POST">

                        <input type="hidden"
                               name="username"
                               th:value="${username}"/>

                        <input type="hidden"
                               name="token"
                               th:value="${token}"/>

                        <div class="mb-3">

                            <label class="form-label"
                                   th:text="#{restablecer.nueva}">
                                Nueva contraseña
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>

                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       minlength="4"
                                       required/>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label"
                                   th:text="#{restablecer.confirmar}">
                                Confirmar contraseña
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>

                                <input type="password"
                                       name="confirmarPassword"
                                       class="form-control"
                                       minlength="4"
                                       required/>

                            </div>

                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-fidness btn-lg">

                                <i class="fas fa-key me-2"></i>

                                <span th:text="#{restablecer.cambiar}">
                                    Cambiar contraseña
                                </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}">
        </script>

    </body>
</html>
