<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
    </head>

    <body>

        <header th:replace="~{general/fragmentos :: header}">
        </header>

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="card shadow">

                        <div class="card-body p-5">

                            <h2 class="titulo mb-4"
                                th:text="#{progreso.form.titulo}">
                                Nuevo Registro de Progreso
                            </h2>

                            <form th:action="@{/progreso/guardar}"
                                  th:object="${progreso}"
                                  method="POST">

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{progreso.form.fecha}">
                                            Fecha
                                        </label>

                                        <input type="date"
                                               class="form-control"
                                               th:field="*{fecha}"
                                               required/>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{progreso.form.peso}">
                                            Peso (kg)
                                        </label>

                                        <input type="number"
                                               step="0.01"
                                               min="1"
                                               class="form-control"
                                               th:field="*{peso}"
                                               required/>

                                    </div>

                                </div>

                                <h5 class="mt-3 mb-3"
                                    th:text="#{progreso.form.medidas}">
                                    Medidas corporales
                                </h5>

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{progreso.form.cintura}">
                                            Cintura (cm)
                                        </label>

                                        <input type="number"
                                               step="0.01"
                                               min="1"
                                               class="form-control"
                                               th:field="*{cintura}"/>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{progreso.form.pecho}">
                                            Pecho (cm)
                                        </label>

                                        <input type="number"
                                               step="0.01"
                                               min="1"
                                               class="form-control"
                                               th:field="*{pecho}"/>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{progreso.form.brazo}">
                                            Brazo (cm)
                                        </label>

                                        <input type="number"
                                               step="0.01"
                                               min="1"
                                               class="form-control"
                                               th:field="*{brazo}"/>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label"
                                               th:text="#{progreso.form.pierna}">
                                            Pierna (cm)
                                        </label>

                                        <input type="number"
                                               step="0.01"
                                               min="1"
                                               class="form-control"
                                               th:field="*{pierna}"/>

                                    </div>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label"
                                           th:text="#{progreso.form.observaciones}">
                                        Observaciones / Avances
                                    </label>

                                    <textarea
                                        class="form-control"
                                        rows="4"
                                        maxlength="500"
                                        th:field="*{observaciones}"
                                        th:placeholder="#{progreso.form.placeholder}">
                                    </textarea>

                                </div>

                                <div class="d-flex gap-2">

                                    <button type="submit"
                                            class="btn btn-success">

                                        <i class="fas fa-save me-1"></i>

                                        <span th:text="#{progreso.form.guardar}">
                                            Guardar Registro
                                        </span>

                                    </button>

                                    <a th:href="@{/progreso/listado}"
                                       class="btn btn-outline-secondary"
                                       th:text="#{accion.cancelar}">
                                        Cancelar
                                    </a>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>

</html>
