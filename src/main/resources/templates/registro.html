<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head>

        <meta charset="UTF-8"/>

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0"/>

        <title th:text="#{registro.tituloPagina}">
            Crear cuenta | FIDNESS
        </title>

        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
              rel="stylesheet"/>

        <link th:href="@{/webjars/font-awesome/css/all.css}"
              rel="stylesheet"/>

        <style>

            body {
                margin: 0;
                min-height: 100vh;
                background: #f8f5ef;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            .registro-wrapper {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 30px;
            }

            .registro-box {
                width: 100%;
                max-width: 1180px;
                background: #ffffff;
                border-radius: 28px;
                overflow: hidden;
                box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
            }

            .registro-image-area {
                position: relative;
                min-height: 720px;
                background: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 45px;
            }

            .image-decoration {
                position: absolute;
                width: calc(100% - 80px);
                height: 72%;
                background: #1d837c;
                border-radius: 28px;
                transform: translate(-12px, 18px);
            }

            .registro-image {
                position: relative;
                z-index: 2;
                width: 100%;
                height: 520px;
                object-fit: cover;
                border-radius: 24px;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            }

            .form-area {
                min-height: 720px;
                display: flex;
                align-items: center;
                padding: 45px 60px;
            }

            .form-content {
                width: 100%;
            }

            .brand-icon {
                width: 72px;
                height: 72px;
                margin: 0 auto 10px auto;
                border-radius: 50%;
                background: linear-gradient(135deg, #0d6efd, #198754);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 30px;
                box-shadow: 0 8px 20px rgba(25, 135, 84, 0.25);
            }

            .brand-title {
                font-size: 2.2rem;
                font-weight: 800;
                letter-spacing: 2px;
                color: #198754;
                margin-bottom: 5px;
            }

            .registro-title {
                color: #237b74;
                font-weight: 700;
                margin-top: 15px;
                margin-bottom: 8px;
            }

            .registro-subtitle {
                color: #777;
                margin-bottom: 28px;
            }

            .form-label {
                color: #237b74;
                font-weight: 600;
            }

            .form-control {
                border: none;
                border-bottom: 2px solid #bbb;
                border-radius: 0;
                background: transparent;
                padding-left: 0;
            }

            .form-control:focus {
                box-shadow: none;
                border-bottom-color: #198754;
                background: transparent;
            }

            .input-group-text {
                border: none;
                border-bottom: 2px solid #bbb;
                border-radius: 0;
                background: transparent;
                color: #198754;
            }

            .btn-fidness {
                background: #1d837c;
                color: white;
                border: none;
                border-radius: 25px;
                padding: 11px 30px;
                font-weight: 700;
                min-width: 190px;
            }

            .btn-fidness:hover {
                background: #176d67;
                color: white;
            }

            .link-fidness {
                color: #237b74;
                font-weight: 600;
                text-decoration: none;
            }

            .link-fidness:hover {
                text-decoration: underline;
            }

            .alert {
                border-radius: 14px;
            }

            @media (max-width: 991px) {

                .registro-image-area {
                    min-height: auto;
                    padding: 25px;
                }

                .image-decoration {
                    display: none;
                }

                .registro-image {
                    height: 300px;
                }

                .form-area {
                    min-height: auto;
                    padding: 40px 30px;
                }
            }

        </style>

    </head>

    <body>

        <div class="registro-wrapper">

            <div class="registro-box">

                <div class="row g-0">

                    <div class="col-lg-7 registro-image-area">

                        <div class="image-decoration">
                        </div>

                        <img
                            src="https://images.unsplash.com/photo-1599058917212-d750089bc07e?w=1200"
                            th:alt="#{registro.imagenAlt}"
                            class="registro-image"/>

                    </div>

                    <div class="col-lg-5 form-area">

                        <div class="form-content">

                            <div class="text-center">

                                <div class="brand-icon">
                                    <i class="fas fa-dumbbell"></i>
                                </div>

                                <div class="brand-title">
                                    FIDNESS
                                </div>

                                <h3 class="registro-title"
                                    th:text="#{registro.titulo}">
                                    Crear cuenta
                                </h3>

                                <p class="registro-subtitle"
                                   th:text="#{registro.subtitulo}">
                                    Empieza a trabajar en tus objetivos.
                                </p>

                            </div>

                            <div th:if="${error}"
                                 class="alert alert-danger"
                                 th:text="${error}">
                            </div>

                            <form th:action="@{/registro/guardar}"
                                  th:object="${usuario}"
                                  method="POST">

                                <div class="row">

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label"
                                               th:text="#{registro.nombre}">
                                            Nombre
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="fas fa-user"></i>
                                            </span>

                                            <input type="text"
                                                   class="form-control"
                                                   th:field="*{nombre}"
                                                   th:placeholder="#{registro.nombrePlaceholder}"
                                                   required/>

                                        </div>

                                    </div>

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label"
                                               th:text="#{registro.apellidos}">
                                            Apellidos
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="fas fa-user"></i>
                                            </span>

                                            <input type="text"
                                                   class="form-control"
                                                   th:field="*{apellidos}"
                                                   th:placeholder="#{registro.apellidosPlaceholder}"
                                                   required/>

                                        </div>

                                    </div>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label"
                                           th:text="#{registro.correo}">
                                        Correo electrónico
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="fas fa-envelope"></i>
                                        </span>

                                        <input type="email"
                                               class="form-control"
                                               th:field="*{correo}"
                                               th:placeholder="#{registro.correoPlaceholder}"
                                               required/>

                                    </div>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label"
                                           th:text="#{registro.telefono}">
                                        Número telefónico
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="fas fa-phone"></i>
                                        </span>

                                        <input type="text"
                                               class="form-control"
                                               th:field="*{telefono}"
                                               placeholder="8888-8888"/>

                                    </div>

                                </div>

                                <div class="row">

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label"
                                               th:text="#{registro.password}">
                                            Contraseña
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="fas fa-lock"></i>
                                            </span>

                                            <input type="password"
                                                   class="form-control"
                                                   th:field="*{password}"
                                                   th:placeholder="#{registro.passwordPlaceholder}"
                                                   minlength="4"
                                                   required/>

                                        </div>

                                    </div>

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label"
                                               th:text="#{registro.confirmar}">
                                            Confirmar contraseña
                                        </label>

                                        <div class="input-group">

                                            <span class="input-group-text">
                                                <i class="fas fa-lock"></i>
                                            </span>

                                            <input type="password"
                                                   class="form-control"
                                                   name="confirmarPassword"
                                                   th:placeholder="#{registro.confirmarPlaceholder}"
                                                   minlength="4"
                                                   required/>

                                        </div>

                                    </div>

                                </div>

                                <div class="text-center mt-2">

                                    <button type="submit"
                                            class="btn btn-fidness">

                                        <i class="fas fa-user-plus me-2"></i>

                                        <span th:text="#{registro.boton}">
                                            Crear cuenta
                                        </span>

                                    </button>

                                </div>

                            </form>

                            <div class="text-center mt-4">

                                <p class="mb-2">

                                    <span th:text="#{registro.yaCuenta}">
                                        ¿Ya tienes una cuenta?
                                    </span>

                                    <a th:href="@{/login}"
                                       class="link-fidness"
                                       th:text="#{registro.login}">
                                        Inicia sesión
                                    </a>

                                </p>

                                <a th:href="@{/}"
                                   class="text-muted text-decoration-none">

                                    <i class="fas fa-arrow-left me-1"></i>

                                    <span th:text="#{registro.volver}">
                                        Volver a FIDNESS
                                    </span>

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}">
        </script>

    </body>

</html>
